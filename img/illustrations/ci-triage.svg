<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <rect width="400" height="240" fill="#eef3f9"/>

  <!-- CI pipeline stages -->
  <line x1="70" y1="55" x2="130" y2="55" stroke="#c3d2e2" stroke-width="3"/>
  <line x1="150" y1="55" x2="210" y2="55" stroke="#c3d2e2" stroke-width="3"/>
  <circle cx="50" cy="55" r="20" fill="#fff" stroke="#5b7a9d" stroke-width="2"/>
  <path d="M42,55 l6,6 l10,-12" fill="none" stroke="#5b7a9d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="140" cy="55" r="20" fill="#fff" stroke="#5b7a9d" stroke-width="2"/>
  <path d="M132,55 l6,6 l10,-12" fill="none" stroke="#5b7a9d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="230" cy="55" r="20" fill="#f6d5d2" stroke="#c0564a" stroke-width="2"/>
  <path d="M222,47 l16,16 M238,47 l-16,16" stroke="#c0564a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- arrow down to agent -->
  <line x1="230" y1="80" x2="230" y2="110" stroke="#9aa7b5" stroke-width="2.5"/>
  <path d="M223,103 l7,10 l7,-10" fill="none" stroke="#9aa7b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- agent (triage) -->
  <g transform="translate(230,150)">
    <circle r="28" fill="#fff" stroke="#7D7D7D" stroke-width="2"/>
    <circle cx="-9" cy="-4" r="3" fill="#212121"/>
    <circle cx="9" cy="-4" r="3" fill="#212121"/>
    <path d="M-10,10 q10,8 20,0" fill="none" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-28" x2="0" y2="-40" stroke="#7D7D7D" stroke-width="2"/>
    <circle cx="0" cy="-42" r="4" fill="#7D7D7D"/>
  </g>

  <!-- arrow right to filed issue -->
  <line x1="262" y1="150" x2="300" y2="150" stroke="#9aa7b5" stroke-width="2.5"/>
  <path d="M293,143 l10,7 l-10,7" fill="none" stroke="#9aa7b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- filed issue document -->
  <g transform="translate(305,120)">
    <rect width="60" height="60" rx="6" fill="#fff" stroke="#5b7a9d" stroke-width="2"/>
    <line x1="12" y1="18" x2="48" y2="18" stroke="#c3d2e2" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="30" x2="48" y2="30" stroke="#c3d2e2" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="42" x2="34" y2="42" stroke="#c3d2e2" stroke-width="4" stroke-linecap="round"/>
    <circle cx="52" cy="46" r="11" fill="#5b7a9d"/>
    <path d="M47,46 l4,4 l7,-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
