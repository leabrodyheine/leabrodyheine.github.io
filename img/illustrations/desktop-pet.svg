<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <rect width="400" height="240" fill="#eef3f9"/>

  <!-- monitor / desktop -->
  <rect x="40" y="30" width="320" height="150" rx="10" fill="#fff" stroke="#5b7a9d" stroke-width="2"/>
  <rect x="52" y="42" width="296" height="126" rx="4" fill="#f4f8fc"/>
  <rect x="170" y="180" width="60" height="16" fill="#dbe6f2" stroke="#5b7a9d" stroke-width="2"/>
  <rect x="140" y="196" width="120" height="10" rx="5" fill="#c3d2e2"/>

  <!-- menu bar -->
  <line x1="52" y1="58" x2="348" y2="58" stroke="#dbe6f2" stroke-width="2"/>
  <circle cx="330" cy="50" r="4" fill="#5b7a9d"/>

  <!-- reminder speech bubble with clock -->
  <g transform="translate(200,74)">
    <rect width="120" height="52" rx="12" fill="#fff" stroke="#5b7a9d" stroke-width="2"/>
    <path d="M20,52 l-2,14 l16,-14" fill="#fff" stroke="#5b7a9d" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="26" cy="26" r="14" fill="none" stroke="#5b7a9d" stroke-width="2.5"/>
    <line x1="26" y1="26" x2="26" y2="17" stroke="#212121" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="26" y1="26" x2="33" y2="30" stroke="#212121" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="52" y1="18" x2="104" y2="18" stroke="#c3d2e2" stroke-width="4" stroke-linecap="round"/>
    <line x1="52" y1="30" x2="88" y2="30" stroke="#c3d2e2" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- desktop pet crossing -->
  <g transform="translate(96,116)">
    <ellipse cx="0" cy="40" rx="22" ry="5" fill="#c3d2e2"/>
    <path d="M-20,10 q-6,-14 4,-16 q4,-10 16,-4 q14,-6 18,8 q10,4 4,16 q4,14 -10,16 l-30,0 q-10,-8 -2,-20 z" fill="#f6d5a8" stroke="#7D7D7D" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-6" cy="4" r="3" fill="#212121"/>
    <circle cx="8" cy="4" r="3" fill="#212121"/>
    <path d="M-5,14 q6,6 12,0" fill="none" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
    <path d="M-18,-4 l-6,-10 M14,-6 l8,-10" fill="none" stroke="#7D7D7D" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- motion trail -->
  <line x1="52" y1="150" x2="70" y2="150" stroke="#9aa7b5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="140" x2="72" y2="140" stroke="#9aa7b5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="160" x2="72" y2="160" stroke="#9aa7b5" stroke-width="2.5" stroke-linecap="round"/>
</svg>
